name: Generate manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/index.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate manifests
        run: python3 .github/scripts/generate_manifest.py

      - name: Commit if changed
        run: |
          git config user.name "manifest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*/index.json'
          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "chore: regenerate catalog manifests [skip ci]"
            git push
          fi
